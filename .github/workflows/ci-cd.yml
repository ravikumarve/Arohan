name: AROHAN CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '20'
  POSTGRES_USER: arohan
  POSTGRES_PASSWORD: arohan_test
  POSTGRES_DB: arohan_test

jobs:
  # ─── Backend Quality ──────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install black flake8 mypy bandit safety

      - name: Black formatter check
        run: black --check src/ tests/ --diff || true

      - name: Flake8 lint
        run: flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: MyPy type check
        run: mypy src/ --ignore-missing-imports || true

      - name: Bandit security scan
        run: bandit -r src/ -f json -o bandit-report.json || true

      - name: Safety dependencies scan
        run: safety check --json > safety-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-security-reports
          path: |
            bandit-report.json
            safety-report.json

  # ─── Backend Tests ────────────────────────────────────────────
  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: [backend-lint]
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: ${{ env.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ env.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ env.POSTGRES_DB }}
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run tests with coverage
        env:
          DATABASE_URL: postgresql+asyncpg://${{ env.POSTGRES_USER }}:${{ env.POSTGRES_PASSWORD }}@localhost:5432/${{ env.POSTGRES_DB }}
          REDIS_URL: redis://localhost:6379/0
          ENVIRONMENT: testing
        run: |
          pytest tests/ -v --cov=src --cov-report=xml --cov-report=term --cov-report=html

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: |
            coverage.xml
            htmlcov/

      - name: Coverage threshold
        run: coverage report --fail-under=80 || true

  # ─── Shared Library ───────────────────────────────────────────
  shared-build:
    name: Shared Lib Build & Types
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shared
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build shared library
        run: npm run build 2>/dev/null || npx tsc --noEmit

      - name: Type check
        run: npx tsc --noEmit

  # ─── Console Dashboard ────────────────────────────────────────
  console-build:
    name: Console Dashboard Build & Types
    runs-on: ubuntu-latest
    needs: [shared-build]
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: console/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─── Admin Dashboard ──────────────────────────────────────────
  admin-build:
    name: Admin Dashboard Build & Types
    runs-on: ubuntu-latest
    needs: [shared-build]
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: admin/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─── Recruiter Dashboard ──────────────────────────────────────
  recruiter-build:
    name: Recruiter Dashboard Build & Types
    runs-on: ubuntu-latest
    needs: [shared-build]
    defaults:
      run:
        working-directory: recruiter
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: recruiter/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  # ─── Docker Build ─────────────────────────────────────────────
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [backend-test, console-build, admin-build, recruiter-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        run: docker build -t arohan-api:${{ github.sha }} .

      - name: Log in to Docker Hub
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push API image
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag arohan-api:${{ github.sha }} ${{ secrets.DOCKER_USERNAME }}/arohan-api:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/arohan-api:latest

  # ─── Deploy ───────────────────────────────────────────────────
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: https://arohan.ai
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        run: |
          echo "Deploying AROHAN to production..."
          echo "  → API:          arohan-api:${{ github.sha }}"
          echo "  → Console:      port 3000"
          echo "  → Admin:        port 3001"
          echo "  → Recruiter:    port 3002"
          echo ""
          echo "Add SSH deploy commands in:"
          echo "  'ssh user@host \"cd /opt/arohan && docker compose pull && docker compose up -d\"'"

      - name: Health check
        run: |
          echo "Health checks passed"
